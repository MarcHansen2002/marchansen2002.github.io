        - "PrisonMiner/GoldMine.png"
        - "PrisonMiner/MineList.png"
        - "PrisonMiner/PalladiumMine.png"
        - "PrisonMiner/ToolLevels.png"
    challenges: >
        Upon the release of the first alpha testing of the game I had realised that I struggled to figure out what
        was obvious to me, that may not be to others. I initially had a lot of confusion from players not understanding where to go,
        which was due to me thinking certain mechanics were common knowledge when it wasn't.
        
        I also struggled to balance well, either one upgrade was too weak and actually detrimental to the player's experience and progression,
        or there'd be another that would instantly carry the player through the entire game. This I spent a lot of time researching and ended up setting
        up tools via spreadsheets to more accurately estimate the time taken to achieve certain things, or see how certain upgrades would affect the player's
        ability in game.
    learned: >
        This project helped me understand linking other unity projects within to gain access to mechanics
        I've previously created without having to copy and paste making maintenance more difficult across projects.
        
        I've also improved my skills within certain design-focused areas such as balancing, game feel and how to make
        mechanics more enjoyable from the player's perspective by communicating with the playerbase to find out what
        feels good and what does not.
