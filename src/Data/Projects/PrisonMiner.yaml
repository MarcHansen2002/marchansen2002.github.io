project:
    title: "Prison Miner"
    subtitle: "A 2D mining simulation game developed in Unity and published to Steam"
    overview: >
        Over the summer break of 2025 some friends and I had decided to work together to create a 2D game in Unity. Unfortunately the other's didn't
        have as much time as I did during this time so I was the only one contributing at the time. Eventually I had realise that due to the other's
        lack of time the game we had designed was out of scope for me to make alone, so I moved onto making Prison Miner. I told the others that I would do
        this but would return to the initial game if they got more free time as I would prefer to make a game that I can finish. I've always enjoyed mining games
        and used to play a lot of the gamemode "Prisons" on Minecraft when I was young, but that mode was always full of pay to win mechanics, so I decided
        what if I made a game heavily inspired on that mode without all the stuff I disliked about the mode. That is how Prison Miner begun, and after a month
        went into a public beta-test, where a lot of feedback was received and the people playing overall enjoyed the game greatly and helped fix a lot of bugs.
        Another month and a half after the beta-test it was released onto steam, where the reception was small, but those few who played it said they loved their
        time on the game. I kept updating the game from there on with 2 major content updates alongside minor patches between for bugs and quality of life changes.
        As of today I am quite busy with University, but am in the middle of a major quality of life re-work / addition update that is currently on hold until
        my assignments wrap up for the year.
    features:
        - "Over 100 unique items"
        - "Over 30 areas to explore and find new materials"
        - "Player customisation using layered sprites and custom shaders"
        - "Json serialisation of non-primitive data types"
        - "Save file version security to ensure saves do not break between updates"
    tech:
        - "C#"
        - "Unity"
        - "Steamworks"
    screenshots:
        - "PrisonMiner/EarlyMineAndSkills.png"
        - "PrisonMiner/Gems.png"
